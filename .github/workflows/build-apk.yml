name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Create JSON Config & Add Android
        run: |
          # TypeScript dosyası varsa temizle ki çakışma yapmasın
          rm -f capacitor.config.ts

          # Saf ve hatasız JSON konfigürasyonunu doğrudan oluşturuyoruz
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tcdd.yoltakip",
            "appName": "TCDD Yol Takip",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          # Android platformunu ekle ve senkronize et
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle Action
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
