name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor Core
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Build Web App
        run: npm run build

      - name: Create JSON Config & Add Android
        run: |
          rm -f capacitor.config.ts

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tcdd.yoltakip",
            "appName": "TCDD Yol Takip",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Fix Kotlin and Dependency Conflicts
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "" >> "$BUILD_GRADLE"
            echo "configurations.all {" >> "$BUILD_GRADLE"
            echo "    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'"
            echo "    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'"
            echo "    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'"
            echo "}" >> "$BUILD_GRADLE"
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
